name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
      - name: Check the tag against main, the version and the changelog
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          version=$(ruby -Ilib -rkeryx/version -e 'print Keryx::VERSION')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match lib/keryx/version.rb ($version)"
            exit 1
          fi
          bin/release notes "$version" > release-notes.md
      - name: Build the gem
        id: build
        run: |
          version=$(ruby -Ilib -rkeryx/version -e 'print Keryx::VERSION')
          mkdir pkg
          gem build keryx.gemspec --output "pkg/keryx-$version.gem"
          (cd pkg && sha256sum "keryx-$version.gem" > SHA256SUMS)
          if [ -f release-notes.md ]; then mv release-notes.md pkg/; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 pkg/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: pkg/
          if-no-files-found: error

  attest:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg
      - name: Check the gem against the build
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$SHA256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pkg/*.gem

  publish:
    needs: [build, attest]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg
      - name: Check the gem against the build
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$SHA256"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the gem
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: gem push "pkg/keryx-$VERSION.gem"

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg
      - name: Check the gem and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$SHA256"
          gh release create "$TAG" --verify-tag --title "keryx $VERSION" --notes-file release-notes.md \
            "keryx-$VERSION.gem" SHA256SUMS
