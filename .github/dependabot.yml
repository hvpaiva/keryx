# The cooldown waits a week after a release before proposing it, so a compromised or yanked
# version has time to be caught.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gems:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
