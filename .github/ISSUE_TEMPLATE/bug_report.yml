name: Bug report
description: Something keryx does differently from what its help or README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The commands you ran and their output, as text.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: keryx version
      description: The output of `keryx version`.
    validations:
      required: true
  - type: input
    id: harnesses
    attributes:
      label: Harnesses and versions
      description: For example Claude Code 2.1.308, Codex 0.163.0, herdr 0.9.5.
  - type: input
    id: os
    attributes:
      label: Operating system
