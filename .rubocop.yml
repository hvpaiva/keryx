plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - vendor/**/*

Metrics/AbcSize:
  Max: 25
  Exclude:
    - test/**/*

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - '*.gemspec'
    - Rakefile

Metrics/ClassLength:
  Max: 200

Metrics/MethodLength:
  Max: 15

Metrics/ParameterLists:
  CountKeywordArgs: false

Minitest/MultipleAssertions:
  Max: 6

Style/Documentation:
  Enabled: false

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
  AllowedCops: []
